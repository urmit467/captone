# Local PostgreSQL for the prototype:  docker compose up -d
# then: psql postgresql://recon:recon@localhost:5432/recon -f schema.sql
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
